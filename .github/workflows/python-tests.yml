name: Python runtime tests

on:
  push:
    branches: [main, v0.1-foundation, feat/scientific-discovery-engine, feat/discovery-brief-condition-diagnostics-20261114]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e ./runtime
      - name: Run V0.5 publication package security tests
        run: python -m unittest discover -s runtime/tests -p 'test_publication.py' -v
      - name: Run V1.0 adversarial stage-evidence contract tests
        run: python -m unittest discover -s runtime/tests -p 'test_stage_contracts.py' -v
      - name: Run V1.0 acceptance validator tests
        run: python -m unittest discover -s runtime/tests -p 'test_acceptance.py' -v
      - name: Run V1.0 acceptance-contract tests
        run: python -m unittest discover -s runtime/tests -p 'test_v1_acceptance_contract.py' -v
      - name: Run V0.9 Run Manager and recovery tests
        run: python -m unittest discover -s runtime/tests -p 'test_run_manager.py' -v
      - name: Run V0.8 fully approved end-to-end synthetic workflow
        run: python -m unittest discover -s runtime/tests -p 'test_end_to_end_synthetic_project.py' -v
      - name: Run V0.7 approval gate tests
        run: python -m unittest discover -s runtime/tests -p 'test_gates.py' -v
      - name: Run V0.7 scientific grain contract tests
        run: python -m unittest discover -s runtime/tests -p 'test_cohort.py' -v
      - name: Run Chem-Literacy adapter and condition-recovery tests
        run: python -m unittest discover -s runtime/tests -p 'test_chem_literacy.py' -v
      - name: Run unit tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Check schema JSON syntax
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]"

name: Python runtime tests

on:
  push:
    branches: [main, v0.1-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e ./runtime
      - name: Run V0.8 fully approved end-to-end synthetic workflow
        run: python -m unittest discover -s runtime/tests -p 'test_end_to_end_synthetic_project.py' -v
      - name: Run V0.7 approval gate tests
        run: python -m unittest discover -s runtime/tests -p 'test_gates.py' -v
      - name: Run V0.7 scientific grain contract tests
        run: python -m unittest discover -s runtime/tests -p 'test_cohort.py' -v
      - name: Run unit tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Check schema JSON syntax
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]"

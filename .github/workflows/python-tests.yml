name: Python runtime tests

on:
  push:
    branches: [main, v0.1-foundation, feat/scientific-discovery-engine, feat/scientific-opportunity-engine, feat/discovery-brief-condition-diagnostics-20261114, feat/generic-data-adapter-interface-20261114, feat/existing-data-scientific-mining, feat/candidate-conflict-reconciliation, feat/deep-scientific-discovery]
  pull_request:
    branches: [main, feat/scientific-discovery-engine, dev/fix-zinc-full-analysis-vquery-8b2ef27, feat/generic-data-adapter-interface-20261114, feat/scientific-opportunity-engine, feat/existing-data-scientific-mining, feat/candidate-conflict-reconciliation]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e ./runtime
      - name: Validate structured-data Run Plan execution bindings
        run: dor validate-execution-contract --plan templates/run_plan.example.json
      - name: Validate Canonical Bundle Run Plan execution bindings
        run: dor validate-execution-contract --plan templates/run_plan.canonical_adapter.example.json
      - name: Run complete runtime test suite once
        run: python -m unittest discover -s runtime/tests -v
      - name: Check repository JSON schema and packaged contract syntax
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]; json.loads(pathlib.Path('runtime/src/dor/stage_execution_contract.json').read_text(encoding='utf-8'))"

  application-smoke:
    name: Structured-data application smoke
    runs-on: ubuntu-slim
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e ./runtime
      - name: Validate all supported route and profile contracts
        run: |
          dor validate-execution-contract --plan templates/run_plan.example.json
          dor validate-execution-contract --plan templates/run_plan.canonical_adapter.example.json
          dor validate-execution-contract --plan templates/run_plan.single_study.example.json
          dor validate-execution-contract --plan templates/run_plan.canonical_adapter.single_study.example.json
      - name: Test explicit Adapter Package initialization
        run: python -m unittest discover -s runtime/tests -p "test_adapter_package.py" -v
      - name: Test project Run Plan initialization
        run: python -m unittest discover -s runtime/tests -p "test_project_setup.py" -v
      - name: Test structured-data CLI Quick Start through G0
        run: python -m unittest discover -s runtime/tests -p "test_application_quickstart.py" -v

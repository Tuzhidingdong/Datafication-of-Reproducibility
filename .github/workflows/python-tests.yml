name: Python runtime tests

on:
  push:
    branches: [main, v0.1-foundation, feat/scientific-discovery-engine, feat/discovery-brief-condition-diagnostics-20261114, feat/generic-data-adapter-interface-20261114, 'fix/**']
  pull_request:
    branches: [main, feat/scientific-discovery-engine, feat/generic-data-adapter-interface-20261114]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: python -m pip install -e ./runtime
      - name: Validate structured-data Run Plan execution bindings
        run: dor validate-execution-contract --plan templates/run_plan.example.json
      - name: Validate Canonical Bundle Run Plan execution bindings
        run: dor validate-execution-contract --plan templates/run_plan.canonical_adapter.example.json
      - name: Run complete runtime test suite once
        run: python -m unittest discover -s runtime/tests -v
      - name: Check repository JSON schema and packaged contract syntax
        run: python -c "import json, pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('schemas').glob('*.json')]; json.loads(pathlib.Path('runtime/src/dor/stage_execution_contract.json').read_text(encoding='utf-8'))"

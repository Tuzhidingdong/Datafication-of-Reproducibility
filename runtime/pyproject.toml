[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dor-runtime"
version = "0.1.0"
description = "Deterministic local runtime for Datafication of Reproducibility"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dor = "dor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dor = ["stage_execution_contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

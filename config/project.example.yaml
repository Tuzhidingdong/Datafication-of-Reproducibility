schema_version: "1.0"

project:
  project_id: "PROJECT_001"
  name: "Example research project"
  description: "Example only. Replace with the approved project scope."

domain_profile: "../project_configuration/domain_profile.yaml"

source_data:
  files:
    - role: "primary_dataset"
      path: "../raw_sources/primary_dataset.csv"
      format: "csv"
      description: "Example tabular source; confirm row and column semantics during audit."
      read_only: true
    - role: "structured_records"
      path: "../raw_sources/structured_records.json"
      format: "json"
      description: "Example structured source; confirm nested record semantics during audit."
      read_only: true

workspace:
  runs_dir: "../workspace/runs"
  cache_dir: "../workspace/cache"
  allow_source_copy: false

workflow:
  mode: "guided"
  approval_gates: ["G0", "G1", "G2", "G3", "G4"]
  source_policy: "preserve"
  max_parallel_workers: 2
  llm_budget:
    policy: "minimize_context_and_reuse_artifacts"
    workers_are_on_demand: true
    require_user_approval_for_deep_investigation: true

notes:
  - "This is a generic example configuration, not a semantic mapping."
  - "Keep project-specific profiles, adapters, source data, and local paths outside the DoR core repository."
  - "Review source structure and provenance before approving any semantic mapping."
